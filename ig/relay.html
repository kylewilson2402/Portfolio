<!doctype html><html><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Kyonic relay</title>
<style>body{background:#07080C;color:#E8F1FF;font:14px monospace;padding:20px;margin:0}textarea{width:100%;height:60vh;background:#0d0f17;color:#9ab;border:2px solid #2B3BFF;font:10px monospace}</style></head>
<body><div id="st">Kyonic upload relay</div><textarea id="t" spellcheck="false"></textarea>
<script>
(async function(){
  var q=new URLSearchParams(location.search), post=q.get('post');
  if(!post){document.getElementById('st').textContent='No post given';return;}
  var man=await (await fetch('manifest.json',{cache:'no-store'})).json();
  var list=man[post], out=[];
  for(var i=0;i<list.length;i++){
    var b=await (await fetch(list[i],{cache:'no-store'})).blob();
    var s=await new Promise(function(r){var fr=new FileReader();fr.onload=function(){r(fr.result.split(',')[1]);};fr.readAsDataURL(b);});
    out.push({name:list[i].split('/').pop(),b64:s});
  }
  var t=document.getElementById('t'); t.value='KYPOST'+JSON.stringify({post:post,files:out});
  document.getElementById('st').textContent='READY '+post+' '+out.length+' files '+t.value.length+' chars';
  t.addEventListener('focus',function(){t.select();});
})();
</script></body></html>
